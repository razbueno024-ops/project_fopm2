<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard — FOPM</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img class="brand-logo" src="/assets/fopm_logo.jpg.jpg" alt="FOPM logo"> FOPM Admin</div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn btn-primary btn-sm" id="createBtn">New concern</button>
    </div>
  </div>

  <div class="admin-layout">
    <div class="admin-sidebar" id="sidebar"></div>
    <div class="admin-main" id="main">
      <div class="empty-state"><div class="glyph">📋</div>Select a tower or thread from the left to get started.</div>
    </div>
    <div class="admin-settings-sidebar">
      <div class="sidebar-section-title">Actions</div>
      <button class="settings-sidebar-item" type="button" data-action="analytics">Analytics</button>
      <button class="settings-sidebar-item" type="button" data-action="user-view">User view</button>
      <button class="settings-sidebar-item" type="button" data-action="export">Export CSV</button>
      <button class="settings-sidebar-item" type="button" data-action="users">Admin users</button>
      <div class="sidebar-section-title" style="margin-top: 16px;">Alerts</div>
      <div class="settings-alerts-container">
        <button class="btn btn-ghost btn-sm" id="notificationsBtn" aria-label="Notifications" style="width:100%; justify-content:flex-start;">Alerts</button>
        <div id="notificationPanel" class="notification-panel" style="position:static; width:100%; max-height:300px; border:none; box-shadow:none; border-top:1px solid var(--line);"></div>
      </div>
      <button class="settings-sidebar-item settings-sidebar-danger" type="button" data-action="logout" style="margin-top: auto;">Log out</button>
    </div>
  </div>

  <!-- Settings modal (simple inline panel) -->
  <div id="settingsPanel" class="center-screen" style="display:none; position:fixed; inset:0; background:rgba(11,18,32,.75); z-index:50;">
    <div class="card login-card">
      <h3>Change admin password</h3>
      <form id="pwForm">
        <div class="field">
          <label>Current password</label>
          <div class="password-row">
            <input type="password" id="curPw" required>
            <button type="button" class="btn btn-ghost btn-sm password-toggle" data-target-id="curPw">Show</button>
          </div>
        </div>
        <div class="field">
          <label>New password</label>
          <div class="password-row">
            <input type="password" id="newPw" required minlength="6">
            <button type="button" class="btn btn-ghost btn-sm password-toggle" data-target-id="newPw">Show</button>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;" type="submit">Update password</button>
      </form>
      <button class="btn btn-ghost btn-sm" style="width:100%; margin-top:10px;" id="closeSettings">Close</button>
    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
