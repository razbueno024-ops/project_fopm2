services:
  - type: web
    name: fopm-feedback
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fopm-db
          property: connectionString

databases:
  - name: fopm-db
    databaseName: fopm
    user: fopm
    plan: free
